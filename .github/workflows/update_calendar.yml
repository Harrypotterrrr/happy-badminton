name: Update NYBC Flushing Availability Calendar

on:
  workflow_dispatch:
  schedule:
    # Twice a day: 9:00 AM and 9:00 PM America/New_York (EDT UTC-4: 13,1 & EST UTC-5: 14,2)
    - cron: '0 1,13 * * *'
    - cron: '0 2,14 * * *'

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check New York twice-daily schedule (9 AM & 9 PM EST/EDT)
        id: check_time
        run: |
          NY_HOUR=$(TZ="America/New_York" date +%-H)
          echo "Current America/New_York hour: ${NY_HOUR}"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Run twice a day at 9 AM (9) and 9 PM (21) New York time
            if (( NY_HOUR != 9 && NY_HOUR != 21 )); then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run NYBC Flushing Crawler
        if: steps.check_time.outputs.should_run == 'true'
        run: python3 nybc_flushing_crawler.py --players 2 3 4 --days 35 --out-dir .

      - name: Commit and push updated calendar
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html nybc_flushing_calendar.html nybc_flushing_calendar.md nybc_flushing_availability.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update NYBC Flushing court availability"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
