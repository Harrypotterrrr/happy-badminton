name: Update NYBC Flushing Availability Calendar

on:
  workflow_dispatch:
  schedule:
    # 9am, 11am, 1pm, 3pm, 5pm, 7pm, 9pm, 11pm America/New_York (EDT UTC-4 & EST UTC-5)
    - cron: '0 1,3,13,15,17,19,21,23 * * *'
    - cron: '0 0,2,4,14,16,18,20,22 * * *'

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check New York active window (9 AM - 11 PM EST/EDT every 2 hours)
        id: check_time
        run: |
          NY_HOUR=$(TZ="America/New_York" date +%-H)
          echo "Current America/New_York hour: ${NY_HOUR}"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Pause automatic updates between 11 PM (after 23:xx) and 9 AM (0..8)
            if (( NY_HOUR < 9 )); then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Run only on the 2-hour marks: 9, 11, 13, 15, 17, 19, 21, 23
            if (( (NY_HOUR - 9) % 2 != 0 )); then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run NYBC Flushing Crawler
        if: steps.check_time.outputs.should_run == 'true'
        run: python3 nybc_flushing_crawler.py --players 2 3 4 --days 35 --out-dir .

      - name: Commit and push updated calendar
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html nybc_flushing_calendar.html nybc_flushing_calendar.md nybc_flushing_availability.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update NYBC Flushing court availability"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
