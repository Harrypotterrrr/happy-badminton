name: Update NYBC Flushing Availability Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run NYBC Flushing Crawler
        run: python3 nybc_flushing_crawler.py --players 2 3 4 --days 35 --out-dir .

      - name: Commit and push updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html nybc_flushing_calendar.html nybc_flushing_calendar.md nybc_flushing_availability.json
          git diff --staged --quiet || git commit -m "chore: update NYBC Flushing court availability"
          git push
